<!DOCTYPE html><html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثواب — شاشة البداية</title>
  <!-- Google Fonts: IBM Plex Sans Arabic & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#FDFBF7',
            appSurface: '#FFFFFF',
            appBorder: '#E2E8F0',
            appText: '#0F172A',
            appMuted: '#475569',
            appPrimary: '#0F172A',
            appGold: '#D97706',
          },
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
            quran: ['"Amiri"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-shadow: none !important;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #FDFBF7;
      color: #0F172A;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .logo-glow {
      animation: subtlePulse 4s ease-in-out infinite;
    }
    @keyframes progressIndeterminate {
      0% { width: 0%; margin-right: 0%; }
      50% { width: 70%; margin-right: 15%; }
      100% { width: 100%; margin-right: 0%; }
    }
    .animate-progress {
      animation: progressIndeterminate 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body class="w-[390px] h-[844px] max-w-[390px] max-h-[844px] mx-auto overflow-hidden bg-[#FDFBF7] flex flex-col justify-between select-none relative border border-[#E2E8F0]">

  <!-- Top Status Bar & Frame Spacer (iOS Safe Area Simulation) -->
  <header class="w-full pt-3 px-6 flex justify-between items-center z-10">
    <span class="text-xs font-medium text-[#475569] tracking-wider font-sans">09:41</span>
    <div class="flex items-center gap-1.5">
      <!-- Battery / Signal icons (hairline vector) -->
      <svg class="w-3.5 h-3.5 text-[#475569]" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0"></path>
        <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path>
      </svg>
      <div class="w-4 h-2 rounded-[2px] border border-[#475569] p-[0.5px] flex items-center">
        <div class="w-2.5 h-full bg-[#475569] rounded-[1px]"></div>
      </div>
    </div>
  </header>

  <!-- Islamic Pattern Subtle Corner Flourishes (Geometric, 1px Hairline, No Shadow) -->
  <div class="absolute top-8 right-6 w-16 h-16 border-t border-r border-[#E2E8F0] pointer-events-none opacity-60"></div>
  <div class="absolute top-8 left-6 w-16 h-16 border-t border-l border-[#E2E8F0] pointer-events-none opacity-60"></div>
  <div class="absolute bottom-12 right-6 w-16 h-16 border-b border-r border-[#E2E8F0] pointer-events-none opacity-60"></div>
  <div class="absolute bottom-12 left-6 w-16 h-16 border-b border-l border-[#E2E8F0] pointer-events-none opacity-60"></div>

  <!-- Center Content: Logo, App Title, Tagline -->
  <main class="flex-1 flex flex-col items-center justify-center px-8 z-10 -mt-6">
    
    <!-- Minimalist Islamic Octagram Symbol + Arabic letter (ثـ) + Open Book / Quran Folds -->
    <div class="relative flex items-center justify-center logo-glow"><img src="https://lh3.googleusercontent.com/aida/AEtjO1VRVEOBp6MFiDUl0EJ9qMo6kWdkJ9Z9ZjNllRTA4-Kl9-0bFH24YrAEyVmifXnV4-iqmO-ZgQ0RyKCUGd4xUyvMjmY4Y1xwP-3Kj_fx49k0JH-cjgQ3pnfZaWVt71K2isFxNDyCKsebloj11uWpLeGE7ryLXhoajaD9SF_5WYtVEXfxceMmkVE7qvR6kr30DgI79MoiSQOmiv8TWOeAOFChQh60Msrr1kT3e7hOwlE" alt="شعار تطبيق ثواب" class="w-28 h-28 rounded-2xl border border-[#E2E8F0] select-none object-cover"></div>

    <!-- App Title & Subtitle -->
    <div class="mt-8 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-[#0F172A] font-sans">
        ثَـــوَاب
      </h1>
      <p class="mt-2 text-xs font-medium text-[#475569] tracking-wide">
        رِفْقَةُ القُرْآنِ وَالأَثَرِ الطَّيِّب
      </p>
    </div>

    <!-- Divider ornament: 1px hairline with center gold diamond -->
    <div class="mt-6 flex items-center justify-center w-28 gap-2">
      <div class="h-[1px] bg-[#E2E8F0] flex-1"></div>
      <div class="w-1.5 h-1.5 rotate-45 border border-[#D97706] bg-[#FFFFFF]"></div>
      <div class="h-[1px] bg-[#E2E8F0] flex-1"></div>
    </div>
  </main>

  <!-- Bottom Area: Progress Bar, Status Text & Reverent Verse / Version -->
  <footer class="w-full px-10 pb-10 flex flex-col items-center z-10">
    
    <!-- Linear Progress Container (Flat, Hairline, Height 2px) -->
    <div class="w-48 h-[3px] bg-[#E2E8F0] rounded-full overflow-hidden relative border-0">
      <div class="h-full bg-[#D97706] rounded-full animate-progress"></div>
    </div>

    <!-- Status Text -->
    <p class="mt-3.5 text-xs text-[#475569] font-medium tracking-normal text-center select-none flex items-center gap-1.5">
      <span class="">جاري تجهيز المصحف...</span>
    </p>

    <!-- Spiritual touch footnote -->
    <div class="mt-8 text-center border-t border-[#E2E8F0] pt-4 w-full flex justify-between items-center text-[10px] text-[#475569]">
      <span class="font-quran text-[12px] text-[#0F172A] opacity-80">«وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا»</span>
      <span class="font-sans text-[10px] text-[#475569]">الإصدار 1.0</span>
    </div>

    <!-- iOS Home Indicator -->
    <div class="w-32 h-1 bg-[#0F172A] opacity-20 rounded-full mt-3"></div>
  </footer>





</body></html>
